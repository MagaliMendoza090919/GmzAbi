<body bgcolor="violet">
<p style="color:purple; font-size:80;">Para poder insertar un registro en una base de datos necesitamos tener claros los registros que vamos a insertar y posteriormente los vamos insertar con el siguiente codigo</p>
<p style="color:purple; font-size:80;">"INSER INTO "NOMBRE DE LA TABLA" (CAMPOS QUE SE AÑADIERON EN LAS TABLAS) VALUES (LAS COSAS QUE VAMOS A AÑADIR)"</p>
</body>
